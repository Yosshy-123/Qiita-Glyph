name: Extract Qiita-Glyph-main ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP safely
        run: |
          unzip -o Qiita-Glyph-main.zip -d temp_extract
          rm -f Qiita-Glyph-main.zip

          rsync -a temp_extract/Qiita-Glyph-main/ .
          rm -rf temp_extract

      - name: Delete this workflow
        run: rm -f .github/workflows/unzip-qiita-glyph.yml

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Extract Qiita-Glyph-main.zip and remove workflow"
          git push