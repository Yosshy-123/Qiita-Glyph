<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Qiita Glyph</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/style.css" />
  <script src="/main.js" defer></script>
</head>
<body>
  <main class="app">
    <aside class="panel">
      <h1>Qiita Glyph</h1>
      <p class="desc">
        Qiita ユーザーのアクティビティを<br />
        SVG バッジとして生成します
      </p>

      <div class="field">
        <label>User ID</label>
        <input id="userId" placeholder="qiita_user" />
      </div>

      <div class="field">
        <label>Theme</label>
        <select id="theme">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>

      <div class="exports">
        <button data-type="url">URL</button>
        <button data-type="md">Markdown</button>
        <button data-type="html">HTML</button>
      </div>

      <code id="output"></code>
    </aside>

    <section class="preview">
      <div class="preview-inner">
        <div class="loader" id="loader"></div>
        <img id="badge" />
      </div>
    </section>
  </main>
</body>
</html>
